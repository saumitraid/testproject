<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

</head>

<body>

    <h2>Login</h2>


    {% if messages %}

        {% for message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>


        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>


        <button type="submit">
            Login
        </button>

    </form>


    <p>

        Didn't receive verification email?

        <a href="{% url 'resend_verification' %}">
            Resend Verification Email
        </a>

    </p>


    <p>

        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>

    </p>

</body>

</html>
