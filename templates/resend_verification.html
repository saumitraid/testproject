<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify Email</title>

</head>

<body>

    <h2>Resend Verification Email</h2>


    {% if messages %}

        {% for message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <br><br>


        <button type="submit">
            Send Verification Email
        </button>

    </form>

</body>

</html>
