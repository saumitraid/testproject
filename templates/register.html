<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

</head>

<body>

    <h2>Create Account</h2>


    {% if messages %}

        {% for message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>


        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <br><br>


        <label>Mobile</label>

        <input
            type="text"
            name="mobile"
        >

        <br><br>


        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>


        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            required
        >

        <br><br>


        <button type="submit">
            Register
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</body>

</html>
